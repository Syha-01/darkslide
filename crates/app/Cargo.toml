[package]
name = "darkslide"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
darkslide-core = { path = "../core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = "0.36"
egui-phosphor = { version = "0.14", features = ["fill"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
log = "0.4"
env_logger = "0.11"
rawler = "0.8"
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"], optional = true }

[features]
screenshot = ["dep:egui_kittest"]
# ONNX Runtime models for AI masks / depth (needs libonnxruntime.so at runtime)
ml = ["darkslide-core/ml"]
